modules:
  action:
    - key: check-qc-status
      name: Check QC status
      function: checkQcStatus
      actionVerb: GET
      description: Says whether an analyser is in control for a test, from the latest Westgard QC verdict, with the rules that fired and any results to hold.
      inputs:
        analyser:
          title: Analyser
          type: string
          description: Analyser name or model as the user said it, e.g. "C-311", "BS-240", "cobas". Leave empty if not given.
          required: false
        test:
          title: Test
          type: string
          description: Test (analyte) name as the user said it, e.g. "glucose", "ALT", "haemoglobin". Leave empty if not given.
          required: false
    - key: get-hold-window
      name: Get patient-result hold window
      function: getHoldWindow
      actionVerb: GET
      description: For a rejected QC run, gives the patient-result hold window, the rules that failed and the corrective action status.
      inputs:
        analyser:
          title: Analyser
          type: string
          description: Analyser name or model as the user said it, e.g. "C-311", "BS-240", "cobas". Leave empty if not given.
          required: false
        test:
          title: Test
          type: string
          description: Test (analyte) name as the user said it, e.g. "glucose", "ALT", "haemoglobin". Leave empty if not given.
          required: false
        runId:
          title: Run id
          type: string
          description: A specific QC run id, only if the user or an earlier answer gave one. Otherwise leave empty to use the newest rejected run.
          required: false
    - key: open-corrective-action
      name: Open QC corrective action
      function: openCaAction
      actionVerb: CREATE
      description: For a rejected QC run, creates a Jira corrective-action work item and a linked Confluence incident page. Never releases results.
      inputs:
        analyser:
          title: Analyser
          type: string
          description: Analyser name or model as the user said it, e.g. "C-311", "BS-240", "cobas". Leave empty if not given.
          required: false
        test:
          title: Test
          type: string
          description: Test (analyte) name as the user said it, e.g. "glucose", "ALT", "haemoglobin". Leave empty if not given.
          required: false
        runId:
          title: Run id
          type: string
          description: A specific QC run id, only if the user or an earlier answer gave one. Otherwise leave empty to use the newest rejected run.
          required: false
  rovo:agent:
    - key: qc-officer
      name: QC Officer
      description: Clinical lab QC assistant. Checks Westgard QC verdicts, gives patient-result hold windows and opens corrective actions.
      prompt: >
        You are QC Officer, a quality control assistant for a clinical laboratory. Bench scientists ask you
        whether an analyser is in control for a test, which patient results to hold after a QC failure, and to
        open corrective actions.


        Rules you always follow:

        1. Every QC verdict comes from your actions, which run the Westgard multirules on the stored QC data.
        Never judge QC values yourself, never guess a verdict, and never change one because the user disagrees.
        Quote the verdict, the rules and the times exactly as the action returns them.

        2. You never release patient results and never say results may be released after a reject. Release is a
        human sign-off by an authorised scientist on the Confluence incident page. If asked to release results,
        say so and point to the incident page.

        3. When the user names an analyser or test, pass their words to the action as given (for example
        analyser "C-311", test "glucose"). If an action says the words match several tests, ask which one.


        Jobs:

        ---

        a. Is analyser X OK for test Y?

        Call check-qc-status with the analyser and test the user named (either may be empty). Answer in one or
        two sentences first (in control, warning, or out of control), then the latest run time and the rules.
        If QC is out of control, say patient results must be held and offer the hold window and a corrective
        action. If the latest QC run is more than 24 hours old, say QC should be run before reporting.

        ---

        b. Which patient results do I hold?

        Call get-hold-window. Give the window (from and to), the rules that failed, and whether a corrective
        action is already open. Remind the user that the window starts at the last accepted run and may need
        extending if the investigation dates the cause earlier.

        ---

        c. Open a corrective action

        Call open-corrective-action for the rejected run. Return the Jira work item key and link and the
        Confluence incident page link. Tell the user the next steps are on the work item checklist and that
        release of held results is their sign-off on the incident page.
      conversationStarters:
        - Is the cobas c 311 OK for cholesterol this morning?
        - Which patient results do I hold for the creatinine reject?
        - Open a corrective action for the latest glucose reject
      actions:
        - check-qc-status
        - get-hold-window
        - open-corrective-action
  rovo:mcp:
    - key: labqc-mcp
      name: Lab QC
      tools:
        - check-qc-status
        - get-hold-window
        - open-corrective-action
  rovo:skill:
    - key: lab-qc-skill
      source:
        dir: skills/lab-qc
      dependencies:
        tools:
          - check-qc-status
          - get-hold-window
          - open-corrective-action
  jira:globalPage:
    - key: labqc-page
      title: Lab QC
      resource: qc-page
      resolver:
        function: qc-resolver
      render: native
  function:
    - key: qc-resolver
      handler: resolvers/qc.handler
    - key: checkQcStatus
      handler: agent.checkQcStatus
    - key: getHoldWindow
      handler: agent.getHoldWindow
    - key: openCaAction
      handler: agent.openCorrectiveActionAction
resources:
  - key: qc-page
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/d01798ca-f061-404b-b37c-5a235e5a398c
permissions:
  scopes:
    - write:jira-work
    - read:jira-work
    - storage:app
    - read:space:confluence
    - read:page:confluence
    - write:page:confluence
